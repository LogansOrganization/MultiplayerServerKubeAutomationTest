# Templated by CI (`envsubst` expands the ${VAR} tokens before `kubectl apply`;
# envsubst does literal substitution, so secret values with special characters
# can't break the templating the way a sed delimiter could). Only non-sensitive
# values are templated in as plain strings — actual credentials come from Secret
# references below, which `kubectl describe`/`get -o yaml` redact (a plain `value:`
# field does not).
#
# Not applied directly — this Job builds the Unity server as a native Kubernetes
# pod (no Docker-in-Docker), so it isn't subject to the runner's own Docker-socket
# path-mismatch problems. CI pulls the build output out with `kubectl cp`, then
# deletes the Job; ttlSecondsAfterFinished is just a safety net.
apiVersion: batch/v1
kind: Job
metadata:
  name: unity-build-${RUN_ID}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: build
          image: ghcr.io/logansorganization/unity-ci-build:${RUN_ID}
          env:
            - name: UNITY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: unity-license-${RUN_ID}
                  key: email
            - name: UNITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unity-license-${RUN_ID}
                  key: password
            - name: UNITY_SERIAL
              valueFrom:
                secretKeyRef:
                  name: unity-license-${RUN_ID}
                  key: serial
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unity-build-token-${RUN_ID}
                  key: token
            - name: GIT_REF
              value: "${GIT_SHA}"
          resources:
            requests:
              cpu: "250m"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
