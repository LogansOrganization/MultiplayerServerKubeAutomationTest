name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/logansorganization/unity-server

jobs:

  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Custom Unity CI Image
        run: |
          docker build -t unity-ci-custom:6000.3.18f1 -f Dockerfile.unity-ci .

      - name: Extract Unity Serial from License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" > /tmp/unity_license.ulf
          B64=$(grep -oP '(?<=<DeveloperData Value=")[^"]*' /tmp/unity_license.ulf)
          SERIAL=$(echo "$B64" | base64 -d | tail -c +5)
          echo "::add-mask::$SERIAL"
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm -f /tmp/unity_license.ulf

      - name: Build Unity Server
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            --workdir /github/workspace \
            --env UNITY_EMAIL \
            --env UNITY_PASSWORD \
            --env UNITY_SERIAL \
            --env SKIP_ACTIVATION=false \
            --env UNITY_VERSION=6000.3.18f1 \
            --env PROJECT_PATH=. \
            --env BUILD_TARGET=StandaloneLinux64 \
            --env BUILD_NAME=StandaloneLinux64 \
            --env BUILD_PATH=buildServer/StandaloneLinux64 \
            --env BUILD_FILE=StandaloneLinux64 \
            --env MANUAL_EXIT=false \
            --env ENABLE_GPU=false \
            --env CUSTOM_PARAMETERS="-standaloneBuildSubtarget Server" \
            --volume "${{ github.workspace }}:/github/workspace" \
            unity-ci-custom:6000.3.18f1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Kubernetes Resources
        run: |
          kubectl apply -f k8s/

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/unity-server \
            unity-server=$IMAGE_NAME:${{ github.sha }}

      - name: Wait For Rollout
        run: |
          kubectl rollout status deployment/unity-server