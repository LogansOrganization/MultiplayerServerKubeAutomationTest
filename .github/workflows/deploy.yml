name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/logansorganization/unity-server

jobs:

  build:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Custom Unity CI Image
        run: |
          docker build --no-cache -t unity-ci-custom:6000.3.18f1 -f Dockerfile.unity-ci .

      - name: Extract Unity Serial from License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" > /tmp/unity_license.ulf
          B64=$(grep -oP '(?<=<DeveloperData Value=")[^"]*' /tmp/unity_license.ulf)
          SERIAL=$(echo "$B64" | base64 -d | tail -c +5)
          echo "::add-mask::$SERIAL"
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm -f /tmp/unity_license.ulf

      - name: Clean stale Unity Library cache
        run: |
          git clean -ffdx
          git reset --hard HEAD

      - name: Force-clean Library from inside a container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/github/workspace" \
            --entrypoint /bin/bash \
            unity-ci-custom:6000.3.18f1 \
            -c "rm -rf /github/workspace/Library /github/workspace/Temp /github/workspace/Logs /github/workspace/obj"

      - name: Build Unity Server
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm \
            --workdir /github/workspace \
            --env UNITY_EMAIL \
            --env UNITY_PASSWORD \
            --env UNITY_SERIAL \
            --env SKIP_ACTIVATION=false \
            --env UNITY_VERSION=6000.3.18f1 \
            --env GITHUB_WORKSPACE=/github/workspace \
            --env PROJECT_PATH=. \
            --env BUILD_TARGET=StandaloneLinux64 \
            --env BUILD_NAME=StandaloneLinux64 \
            --env BUILD_PATH=buildServer/StandaloneLinux64 \
            --env BUILD_FILE=StandaloneLinux64 \
            --env BUILD_METHOD=Build.Server \
            --env MANUAL_EXIT=false \
            --env ENABLE_GPU=false \
            --volume "${{ github.workspace }}:/github/workspace" \
            unity-ci-custom:6000.3.18f1

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Fleet Image Tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|" k8s/fleet.yaml

      - name: Apply Fleet
        run: |
          kubectl apply -f k8s/fleet.yaml

      - name: Wait For Fleet Rollout
        run: |
          for i in $(seq 1 30); do
            READY=$(kubectl get fleet unity-server -o jsonpath='{.status.readyReplicas}')
            DESIRED=$(kubectl get fleet unity-server -o jsonpath='{.spec.replicas}')
            echo "Ready: ${READY:-0}/${DESIRED}"
            [ "$READY" = "$DESIRED" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for fleet rollout" >&2
          exit 1