name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev
  workflow_dispatch:   # "Run workflow" button: redeploy without pushing

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: LogansOrganization/unity-k8s-pipeline/.github/workflows/deploy.yml@v1.1
    with:
      server_image_name: ghcr.io/logansorganization/unity-server
      k8s_namespace: default
    secrets:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
