name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/logansorganization/unity-server

jobs:

  build:
    runs-on: self-hosted
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Unity Serial from License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" > /tmp/unity_license.ulf
          B64=$(grep -oP '(?<=<DeveloperData Value=")[^"]*' /tmp/unity_license.ulf)
          SERIAL=$(echo "$B64" | base64 -d | tail -c +5)
          echo "::add-mask::$SERIAL"
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm -f /tmp/unity_license.ulf

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Unity CI Image
        run: |
          docker build -f Dockerfile.unity-build \
            -t ghcr.io/logansorganization/unity-ci-build:${{ github.sha }} .
          docker push ghcr.io/logansorganization/unity-ci-build:${{ github.sha }}

      - name: Render and Apply Unity Build Job
        env:
          RUN_ID: ${{ github.sha }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          envsubst < k8s/build-job.yaml | kubectl apply --request-timeout=15s -f -

      - name: Wait For Unity Build Job
        run: |
          for i in $(seq 1 90); do
            SUCCEEDED=$(kubectl get job unity-build-${{ github.sha }} --request-timeout=15s -o jsonpath='{.status.succeeded}')
            FAILED=$(kubectl get job unity-build-${{ github.sha }} --request-timeout=15s -o jsonpath='{.status.failed}')
            [ "$SUCCEEDED" = "1" ] && exit 0
            if [ "$FAILED" = "1" ]; then
              echo "Build job failed — logs:"
              kubectl logs job/unity-build-${{ github.sha }} --all-containers --request-timeout=15s || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for Unity build job — logs:"
          kubectl logs job/unity-build-${{ github.sha }} --all-containers --request-timeout=15s || true
          exit 1

      - name: Extract Build Output
        run: |
          POD=$(kubectl get pods -l job-name=unity-build-${{ github.sha }} --request-timeout=15s -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "$POD:/workspace/buildServer" ./buildServer

      - name: Clean Up Unity Build Job
        if: always()
        run: |
          kubectl delete job unity-build-${{ github.sha }} --request-timeout=15s --ignore-not-found

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Fleet Image Tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|" k8s/fleet.yaml

      - name: Apply Fleet
        run: |
          kubectl apply -f k8s/fleet.yaml

      - name: Wait For Fleet Rollout
        run: |
          for i in $(seq 1 30); do
            READY=$(kubectl get fleet unity-server -o jsonpath='{.status.readyReplicas}')
            DESIRED=$(kubectl get fleet unity-server -o jsonpath='{.spec.replicas}')
            echo "Ready: ${READY:-0}/${DESIRED}"
            [ "$READY" = "$DESIRED" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for fleet rollout" >&2
          exit 1