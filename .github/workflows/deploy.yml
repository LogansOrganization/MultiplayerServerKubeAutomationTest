name: Build and Deploy Unity Server

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ghcr.io/logansorganization/unity-server

jobs:

  build:
    runs-on: self-hosted
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Unity Serial from License
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "$UNITY_LICENSE" > /tmp/unity_license.ulf
          B64=$(grep -oP '(?<=<DeveloperData Value=")[^"]*' /tmp/unity_license.ulf)
          SERIAL=$(echo "$B64" | base64 -d | tail -c +5)
          echo "::add-mask::$SERIAL"
          echo "UNITY_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          rm -f /tmp/unity_license.ulf

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Unity CI Image
        run: |
          docker build -f Dockerfile.unity-build \
            -t ghcr.io/logansorganization/unity-ci-build:${{ github.sha }} .
          docker push ghcr.io/logansorganization/unity-ci-build:${{ github.sha }}

      - name: Create Per-Run Secrets
        env:
          GH_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          kubectl create secret generic unity-build-token-${{ github.sha }} \
            --from-literal=token="$GH_TOKEN_VALUE" \
            --namespace=default \
            --request-timeout=15s \
            --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -

          kubectl create secret generic unity-license-${{ github.sha }} \
            --from-literal=email="$UNITY_EMAIL" \
            --from-literal=password="$UNITY_PASSWORD" \
            --from-literal=serial="$UNITY_SERIAL" \
            --namespace=default \
            --request-timeout=15s \
            --dry-run=client -o yaml | kubectl apply --request-timeout=15s -f -

      - name: Render and Apply Unity Build Job
        env:
          RUN_ID: ${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
        run: |
          envsubst < k8s/build-job.yaml | kubectl apply --request-timeout=15s -f -

      - name: Wait For Unity Build Job
        run: |
          for i in $(seq 1 120); do
            POD=$(kubectl get pods -l job-name=unity-build-${{ github.sha }} --request-timeout=15s -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              EXIT_CODE=$(kubectl exec "$POD" --request-timeout=15s -- cat /workspace/BUILD_EXIT_CODE 2>/dev/null || true)
              if [ -n "$EXIT_CODE" ]; then
                echo "POD_NAME=$POD" >> "$GITHUB_ENV"
                echo "BUILD_JOB_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"
                echo "Build phase finished with exit code $EXIT_CODE"
                exit 0
              fi
              PHASE=$(kubectl get pod "$POD" --request-timeout=15s -o jsonpath='{.status.phase}' 2>/dev/null || true)
              if [ "$PHASE" = "Failed" ]; then
                echo "Pod failed before completing the build — logs:"
                kubectl logs "$POD" --request-timeout=15s || true
                exit 1
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for Unity build job"
          [ -n "${POD:-}" ] && kubectl logs "$POD" --request-timeout=15s || true
          exit 1

      - name: Extract Build Output
        run: |
          kubectl cp "$POD_NAME:/workspace/buildServer" ./buildServer --request-timeout=15s
          echo "Unity build exit code was $BUILD_JOB_EXIT_CODE"
          [ "$BUILD_JOB_EXIT_CODE" = "0" ]

      - name: Clean Up Unity Build Job
        if: always()
        run: |
          kubectl delete job unity-build-${{ github.sha }} --request-timeout=15s --ignore-not-found
          kubectl delete secret unity-build-token-${{ github.sha }} --request-timeout=15s --ignore-not-found
          kubectl delete secret unity-license-${{ github.sha }} --request-timeout=15s --ignore-not-found

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Fleet Image Tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|" k8s/fleet.yaml

      - name: Apply Fleet
        run: |
          kubectl apply -f k8s/fleet.yaml

      - name: Wait For Fleet Rollout
        run: |
          for i in $(seq 1 30); do
            READY=$(kubectl get fleet unity-server -o jsonpath='{.status.readyReplicas}')
            ALLOCATED=$(kubectl get fleet unity-server -o jsonpath='{.status.allocatedReplicas}')
            DESIRED=$(kubectl get fleet unity-server -o jsonpath='{.spec.replicas}')
            READY=${READY:-0}
            ALLOCATED=${ALLOCATED:-0}
            echo "Ready: $READY, Allocated: $ALLOCATED, Desired: $DESIRED"
            [ "$((READY + ALLOCATED))" -ge "$DESIRED" ] && exit 0
            sleep 10
          done
          echo "Timed out waiting for fleet rollout" >&2
          exit 1